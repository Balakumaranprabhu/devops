name: Hello World Workflow
on: 
  workflow_dispatch:
env:
  VAR_ENV: STRING
jobs:
  say-hello-inline-bash:
    runs-on: ubuntu-latest
    env:
      VAR_ENVV: Test
      VAR_NUM1: 2
      VAR_NUM2: 3
    steps:
      - name: Say Hello
        run: echo "Hello, World!"
      - name: variables
        run: echo "${{ github.ref }}"
      - name: customVaribale
        run: echo "${{ env.VAR_ENV }}"
      - name: testJobVariabel
        run: echo "${{env.VAR_ENVV}}"

  newjob:
    runs-on: ubuntu-latest
    needs: say-hello-inline-bash

  newjob2:
    runs-on: ubuntu-latest
    needs: [say-hello-inline-bash, newjob]
    
