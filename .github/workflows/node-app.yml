name: Hello node
on: push
jobs:
  hello:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest,windows-latest]
        node: [18,20,22]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{matrix.node}}
      - run: npm start
